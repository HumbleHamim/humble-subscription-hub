name: Build & Deploy to GitHub Pages

on:
  pull_request:          # build-only check, never deploys
  workflow_dispatch:     # manual deploy: Actions tab -> Run workflow (on main)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Leave the repo variable BASE_PATH unset when using a custom domain.
          # For username.github.io/humble-subscription-hub set it to /humble-subscription-hub
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
